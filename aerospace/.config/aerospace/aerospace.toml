# Dokumentation: https://nikitabobko.github.io/AeroSpace/guide

config-version = 2

after-startup-command = []
start-at-login = true

# ─────────────────────────────────────────────
# NORMALIZATION
# ─────────────────────────────────────────────
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# ─────────────────────────────────────────────
# LAYOUT
# ─────────────────────────────────────────────
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'   # horizontal auf breiten, vertikal auf hohen Monitoren

# ─────────────────────────────────────────────
# MOUSE
# ─────────────────────────────────────────────
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# ─────────────────────────────────────────────
# GAPS
# ─────────────────────────────────────────────
[gaps]
inner.horizontal = 0
inner.vertical   = 0
outer.left       = 0
outer.right      = 0
outer.top        = 0
outer.bottom     = 0

# ─────────────────────────────────────────────
# KEY MAPPING
# ─────────────────────────────────────────────
[key-mapping]
preset = 'qwerty'

# ─────────────────────────────────────────────
# BINDINGS
# ─────────────────────────────────────────────
[mode.main.binding]

cmd-ctrl-h = 'focus left'
cmd-ctrl-j = 'focus down'
cmd-ctrl-k = 'focus up'
cmd-ctrl-l = 'focus right'

cmd-ctrl-shift-h = 'move left'
cmd-ctrl-shift-j = 'move down'
cmd-ctrl-shift-k = 'move up'
cmd-ctrl-shift-l = 'move right'


cmd-ctrl-t = 'workspace term --auto-back-and-forth'
cmd-ctrl-shift-t = 'move-node-to-workspace term'
cmd-ctrl-b = 'workspace browser --auto-back-and-forth'
cmd-ctrl-shift-b = 'move-node-to-workspace browser'
cmd-ctrl-o = 'workspace org --auto-back-and-forth'
cmd-ctrl-shift-o = 'move-node-to-workspace org'
cmd-ctrl-m = 'workspace media --auto-back-and-forth'
cmd-ctrl-shift-m = 'move-node-to-workspace media'
cmd-ctrl-f = 'workspace finder --auto-back-and-forth'
cmd-ctrl-shift-f = 'move-node-to-workspace finder'
cmd-ctrl-a = 'workspace ai --auto-back-and-forth'
cmd-ctrl-shift-a = 'move-node-to-workspace ai'
cmd-ctrl-i = 'workspace inbox --auto-back-and-forth'
cmd-ctrl-shift-i = 'move-node-to-workspace inbox'
cmd-ctrl-p = 'workspace paper --auto-back-and-forth'
cmd-ctrl-shift-p = 'move-node-to-workspace paper'
cmd-ctrl-e = 'workspace emacs --auto-back-and-forth'
cmd-ctrl-shift-e = 'move-node-to-workspace emacs'

cmd-ctrl-comma = 'layout tiles horizontal vertical'
cmd-ctrl-period = 'layout accordion horizontal vertical'

cmd-ctrl-enter = 'fullscreen'

cmd-ctrl-slash = 'move-workspace-to-monitor --wrap-around next'

# ─────────────────────────────────────────────
# App specific config
# ─────────────────────────────────────────────
# on-window-detected = {
#       if = 'test %{app-bundle-id} = com.1password.1password',
#       run = 'layout floating',
#   }

# ─────────────────────────────────────────────
# RESIZE MODE
# ─────────────────────────────────────────────
cmd-ctrl-r = 'mode resize'
[mode.resize.binding]
h = 'resize width -50'
l = 'resize width +50'
k = 'resize height -50'
j = 'resize height +50'
esc = 'mode main'
